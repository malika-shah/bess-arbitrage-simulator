name: Fetch Live Grid Prices

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Grid Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gridstatus pandas

      - name: Fetch Live Market LMP Curves
        run: |
          python -c "
          import json, datetime
          import gridstatus
          import pandas as pd

          now = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')

          # Default fallback curves in case ISO endpoints rate-limit
          data = {
              'updated_at': now,
              'ercot': [28, 25, 22, 20, 22, 35, 65, 80, 55, 40, 30, 25, 22, 20, 28, 45, 120, 350, 480, 210, 85, 45, 30, 25],
              'caiso': [35, 30, 28, 25, 30, 45, 60, 40, 10, -5, -15, -10, 0, 5, 15, 35, 85, 160, 210, 140, 80, 55, 42, 38],
              'pjm':   [45, 42, 40, 45, 65, 110, 155, 140, 95, 75, 65, 60, 58, 55, 62, 85, 130, 175, 190, 150, 105, 70, 55, 48]
          }

          # 1. Fetch CAISO Day-Ahead Hourly LMP
          try:
              caiso = gridstatus.CAISO()
              df_caiso = caiso.get_lmp_day_ahead_hourly(date='today')
              if not df_caiso.empty and 'LMP' in df_caiso.columns:
                  hourly = df_caiso.groupby(df_caiso['Time'].dt.hour)['LMP'].mean().round(2).tolist()
                  if len(hourly) == 24:
                      data['caiso'] = hourly
                      print('✅ CAISO live data updated.')
          except Exception as e:
              print(f'⚠️ CAISO fetch error, using fallback curve: {e}')

          # 2. Fetch ERCOT Day-Ahead Hourly LMP
          try:
              ercot = gridstatus.Ercot()
              df_ercot = ercot.get_lmp_day_ahead_hourly(date='today')
              if not df_ercot.empty and 'LMP' in df_ercot.columns:
                  hourly = df_ercot.groupby(df_ercot['Time'].dt.hour)['LMP'].mean().round(2).tolist()
                  if len(hourly) == 24:
                      data['ercot'] = hourly
                      print('✅ ERCOT live data updated.')
          except Exception as e:
              print(f'⚠️ ERCOT fetch error, using fallback curve: {e}')

          # 3. Fetch PJM Day-Ahead Hourly LMP
          try:
              pjm = gridstatus.PJM()
              df_pjm = pjm.get_lmp_day_ahead_hourly(date='today')
              if not df_pjm.empty and 'LMP' in df_pjm.columns:
                  hourly = df_pjm.groupby(df_pjm['Time'].dt.hour)['LMP'].mean().round(2).tolist()
                  if len(hourly) == 24:
                      data['pjm'] = hourly
                      print('✅ PJM live data updated.')
          except Exception as e:
              print(f'⚠️ PJM fetch error, using fallback curve: {e}')

          with open('prices.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Auto-update live grid price profiles [$(date -u +'%Y-%m-%d %H:%M')]" || exit 0
          git push
