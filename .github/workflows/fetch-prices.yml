name: Fetch Live LMP Data

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gridstatus pandas requests

      - name: Fetch LMP Data & Generate prices.json
        run: |
          python - << 'EOF'
          import json
          import time
          from datetime import datetime, timezone
          import requests
          import gridstatus

          # Baseline fallback datasets
          data = {
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "ercot": [28, 25, 22, 20, 22, 35, 65, 80, 55, 40, 30, 25, 22, 20, 28, 45, 120, 350, 480, 210, 85, 45, 30, 25],
              "caiso": [35, 30, 28, 25, 30, 45, 60, 40, 10, -5, -15, -10, 0, 5, 15, 35, 85, 160, 210, 140, 80, 55, 42, 38],
              "nyiso": [40, 38, 35, 36, 45, 70, 95, 85, 60, 50, 45, 42, 40, 38, 42, 55, 90, 140, 160, 115, 80, 55, 48, 42]
          }

          # Load existing prices.json as baseline if present
          try:
              with open('prices.json', 'r') as f:
                  existing = json.load(f)
                  data['ercot'] = existing.get('ercot', data['ercot'])
                  data['caiso'] = existing.get('caiso', data['caiso'])
                  data['nyiso'] = existing.get('nyiso', data['nyiso'])
          except Exception:
              pass

          # Intercept requests for CAISO to attach custom headers & timeout
          _orig_request = requests.Session.request
          def _patched_request(self, method, url, **kwargs):
              if 'caiso' in str(url).lower() or 'oasis' in str(url).lower():
                  headers = kwargs.get('headers') or {}
                  headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                  kwargs['headers'] = headers
                  if kwargs.get('timeout') is None:
                      kwargs['timeout'] = 15
              return _orig_request(self, method, url, **kwargs)

          requests.Session.request = _patched_request

          # 1. Fetch CAISO Day-Ahead Hourly LMP
          caiso_success = False
          for attempt in range(3):
              try:
                  iso = gridstatus.Caiso()
                  df = iso.get_lmp(date='today', market='DAY_AHEAD_HOURLY')
                  if not df.empty:
                      time_col = 'Time' if 'Time' in df.columns else 'Interval Start'
                      price_col = 'LMP' if 'LMP' in df.columns else df.columns[-1]
                      hourly = df.groupby(df[time_col].dt.hour)[price_col].mean().round(2).tolist()
                      if len(hourly) == 24:
                          data['caiso'] = hourly
                          print('✅ CAISO live data updated.')
                          caiso_success = True
                          break
              except Exception as e:
                  print(f'⚠️ CAISO attempt {attempt + 1} failed: {e}')
                  time.sleep(3)

          if not caiso_success:
              print('⚠️ Using CAISO fallback curve after retries.')

          # 2. Fetch ERCOT Day-Ahead Hourly LMP
          try:
              iso = gridstatus.Ercot()
              df = iso.get_lmp(date='today', market='DAY_AHEAD_HOURLY')
              if not df.empty:
                  time_col = 'Time' if 'Time' in df.columns else 'Interval Start'
                  price_col = 'LMP' if 'LMP' in df.columns else df.columns[-1]
                  hourly = df.groupby(df[time_col].dt.hour)[price_col].mean().round(2).tolist()
                  if len(hourly) == 24:
                      data['ercot'] = hourly
                      print('✅ ERCOT live data updated.')
          except Exception as e:
              print(f'⚠️ ERCOT fetch error, using fallback curve: {e}')

          # 3. Fetch NYISO Day-Ahead Hourly LMP
          try:
              iso = gridstatus.Nyiso()
              df = iso.get_lmp(date='today', market='DAY_AHEAD_HOURLY')
              if not df.empty:
                  time_col = 'Time' if 'Time' in df.columns else 'Interval Start'
                  price_col = 'LMP' if 'LMP' in df.columns else df.columns[-1]
                  hourly = df.groupby(df[time_col].dt.hour)[price_col].mean().round(2).tolist()
                  if len(hourly) == 24:
                      data['nyiso'] = hourly
                      print('✅ NYISO live data updated.')
          except Exception as e:
              print(f'⚠️ NYISO fetch error, using fallback curve: {e}')

          # Write out updated dataset
          with open('prices.json', 'w') as f:
              json.dump(data, f, indent=2)

          EOF

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live market LMP data [skip ci]"
          file_pattern: "prices.json"
