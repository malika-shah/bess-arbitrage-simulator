name: Fetch Live LMP Data

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gridstatus pandas requests

      - name: Fetch LMP Data & Generate prices.json
        run: |
          python - << 'EOF'
          import json
          import time
          from datetime import datetime, timezone
          import pandas as pd
          import requests
          import gridstatus

          # Baseline fallback datasets
          data = {
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "ercot": [28, 25, 22, 20, 22, 35, 65, 80, 55, 40, 30, 25, 22, 20, 28, 45, 120, 350, 480, 210, 85, 45, 30, 25],
              "caiso": [35, 30, 28, 25, 30, 45, 60, 40, 10, -5, -15, -10, 0, 5, 15, 35, 85, 160, 210, 140, 80, 55, 42, 38],
              "nyiso": [40, 38, 35, 36, 45, 70, 95, 85, 60, 50, 45, 42, 40, 38, 42, 55, 90, 140, 160, 115, 80, 55, 48, 42]
          }

          # Preserve existing prices.json data as baseline if present
          try:
              with open('prices.json', 'r') as f:
                  existing = json.load(f)
                  for key in ['ercot', 'caiso', 'nyiso']:
                      data[key] = existing.get(key, data[key])
          except Exception:
              pass

          # Intercept requests for CAISO to attach custom headers & timeout
          _orig_request = requests.Session.request
          def _patched_request(self, method, url, **kwargs):
              if 'caiso' in str(url).lower() or 'oasis' in str(url).lower():
                  headers = kwargs.get('headers') or {}
                  headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                  kwargs['headers'] = headers
                  kwargs.setdefault('timeout', 15)
              return _orig_request(self, method, url, **kwargs)

          requests.Session.request = _patched_request

          def process_iso_df(df, price_col):
              if df is None or df.empty:
                  return None
              time_col = 'Time' if 'Time' in df.columns else 'Interval Start'
              df['Hour'] = pd.to_datetime(df[time_col]).dt.hour
              hourly = df.groupby('Hour')[price_col].mean().round(2).tolist()
              return hourly if len(hourly) >= 23 else None

          # 1. Fetch CAISO Day-Ahead Hourly LMP (SP15 Trading Hub)
          try:
              iso = gridstatus.get_iso('caiso')
              df = iso.get_lmp(date='today', market='DAY_AHEAD_HOURLY', locations=['TH_SP15_GEN-APND'])
              res = process_iso_df(df, 'LMP')
              if res:
                  data['caiso'] = res
                  print('✅ CAISO live data updated.')
          except Exception as e:
              print(f'⚠️ CAISO fetch failed: {e}')

          # 2. Fetch ERCOT Day-Ahead Hourly SPP (Trading Hubs)
          try:
              iso = gridstatus.get_iso('ercot')
              df = iso.get_spp(date='today', market='DAY_AHEAD_HOURLY', location_type='Trading Hub')
              res = process_iso_df(df, 'SPP')
              if res:
                  data['ercot'] = res
                  print('✅ ERCOT live data updated.')
          except Exception as e:
              print(f'⚠️ ERCOT fetch failed: {e}')

          # 3. Fetch NYISO Day-Ahead Hourly LMP (N.Y.C. Zone)
          try:
              iso = gridstatus.get_iso('nyiso')
              df = iso.get_lmp(date='today', market='DAY_AHEAD_HOURLY', locations=['N.Y.C.'])
              res = process_iso_df(df, 'LMP')
              if res:
                  data['nyiso'] = res
                  print('✅ NYISO live data updated.')
          except Exception as e:
              print(f'⚠️ NYISO fetch failed: {e}')

          # Write out updated dataset
          with open('prices.json', 'w') as f:
              json.dump(data, f, indent=2)

          EOF

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live market LMP data [skip ci]"
          file_pattern: "prices.json"
